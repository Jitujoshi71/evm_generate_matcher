[package]
name = "evm_generator_matcher"
version = "0.1.0"
edition = "2021"

[dependencies]
bip32 = "0.5"
bip39 = "2.0"
crossbeam-channel = "0.5"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
sha3 = "0.10"
hex = "0.4"
sysinfo = "0.30"
zeroize = "1.7"
ctrlc = "3.4"
memmap2 = "0.9"
twox-hash = "1.6"
rayon = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
